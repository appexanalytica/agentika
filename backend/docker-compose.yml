version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: agentika-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - agentika-network

  minio:
    image: minio/minio:latest
    container_name: agentika-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - agentika-network

  backend:
    build: .
    container_name: agentika-backend
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://root:root@mongodb:27017/agentika
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      JWT_SECRET: your-secret-key-here
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
      - minio
    networks:
      - agentika-network

volumes:
  mongodb_data:
  minio_data:

networks:
  agentika-network:
    driver: bridge
