<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;display:flex;align-items:center;justify-content:center;min-height:100vh}
canvas{border-radius:16px;display:block}
</style>
<canvas id="c" width="800" height="500"></canvas>
<script>
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const W=800,H=500;
let t=0;

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

const codeLines=[
  {text:'const app = createApp({',color:'#7F77DD',indent:0},
  {text:'  components: [Header, Dashboard],',color:'#AFA9EC',indent:0},
  {text:'  database: PostgreSQL,',color:'#97C459',indent:0},
  {text:'  auth: JWT.verify(token),',color:'#EF9F27',indent:0},
  {text:'  api: REST.connect(endpoint),',color:'#AFA9EC',indent:0},
  {text:'  scale: cloud.auto(),',color:'#5DCAA5',indent:0},
  {text:'  deploy: pipeline.run()',color:'#7F77DD',indent:0},
  {text:'});',color:'#AFA9EC',indent:0},
  {text:'',color:'#444',indent:0},
  {text:'app.listen(3000)',color:'#97C459',indent:0},
];

const uiComponents=[
  {x:440,y:60,w:330,h:55,label:'Header',color:'#534AB7'},
  {x:440,y:130,w:150,h:180,label:'Sidebar',color:'#3C3489'},
  {x:600,y:130,w:170,h:80,label:'Dashboard',color:'#26215C'},
  {x:600,y:220,w:80,h:88,label:'Stats',color:'#26215C'},
  {x:690,y:220,w:80,h:88,label:'Chart',color:'#26215C'},
  {x:440,y:320,w:330,h:50,label:'Footer',color:'#1a1840'},
];

let typedChars=0;
let deployProgress=0;
let deployDone=false;

function drawCode(){
  // editor bg
  rr(20,40,390,370,12);
  ctx.fillStyle='#12111f';
  ctx.fill();
  ctx.strokeStyle='rgba(83,74,183,0.4)';
  ctx.lineWidth=1;
  ctx.stroke();

  // editor header
  rr(20,40,390,30,12);
  ctx.fillStyle='#1a1840';
  ctx.fill();
  ctx.fillStyle='#F09595'; ctx.beginPath(); ctx.arc(40,55,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#EF9F27'; ctx.beginPath(); ctx.arc(56,55,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#97C459'; ctx.beginPath(); ctx.arc(72,55,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(127,119,221,0.5)';
  ctx.font='11px monospace';
  ctx.fillText('app.js',160,59);

  // line numbers + code
  const totalChars=codeLines.reduce((a,l)=>a+l.text.length,0);
  typedChars=Math.min(totalChars, Math.floor(t*3));
  let drawn=0;
  codeLines.forEach((line,i)=>{
    const y=88+i*26;
    // line number
    ctx.fillStyle='rgba(127,119,221,0.3)';
    ctx.font='11px monospace';
    ctx.fillText(String(i+1).padStart(2,' '),28,y);
    // code text
    const charsForLine=Math.max(0,typedChars-drawn);
    const visible=line.text.slice(0,charsForLine);
    ctx.fillStyle=line.color;
    ctx.font='12px monospace';
    ctx.fillText(visible,52,y);
    drawn+=line.text.length;
    // cursor blink
    if(drawn-line.text.length<=typedChars && typedChars<drawn){
      if(Math.floor(t*3)%2===0){
        const cursorX=52+ctx.measureText(visible).width;
        ctx.fillStyle='#7F77DD';
        ctx.fillRect(cursorX,y-13,2,16);
      }
    }
  });

  // terminal at bottom
  rr(20,420,390,60,10);
  ctx.fillStyle='#0a0a14';
  ctx.fill();
  ctx.strokeStyle='rgba(83,74,183,0.2)';
  ctx.lineWidth=0.5;
  ctx.stroke();
  ctx.fillStyle='#97C459';
  ctx.font='11px monospace';
  ctx.fillText('▶ Building...', 32,443);
  deployProgress=Math.min(100,Math.floor((t*8)%120));
  const bar=Math.floor(deployProgress/100*28);
  ctx.fillStyle='rgba(83,74,183,0.2)';
  rr(32,450,280,10,5); ctx.fill();
  ctx.fillStyle='#7F77DD';
  rr(32,450,bar*10,10,5); ctx.fill();
  ctx.fillStyle='#5DCAA5';
  ctx.fillText(deployProgress+'%',320,460);
  if(deployProgress>80){
    ctx.fillStyle='#5DCAA5';
    ctx.fillText('✓ Ready in 1.2s',32,473);
  }
}

function drawUI(){
  uiComponents.forEach((comp,i)=>{
    const delay=i*0.3;
    const appear=Math.min(1,Math.max(0,(t*0.5-delay)));
    const alpha=appear;
    const scale=0.85+0.15*appear;
    const cx=comp.x+comp.w/2;
    const cy=comp.y+comp.h/2;

    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.translate(cx,cy);
    ctx.scale(scale,scale);
    ctx.translate(-cx,-cy);

    rr(comp.x,comp.y,comp.w,comp.h,8);
    ctx.fillStyle=comp.color;
    ctx.fill();
    ctx.strokeStyle=`rgba(127,119,221,${0.4+0.2*Math.sin(t+i)})`;
    ctx.lineWidth=1;
    ctx.stroke();

    // inner detail
    if(comp.label==='Dashboard'){
      // mini chart
      [0,1,2,3].forEach((j)=>{
        const bh=20+j*8;
        ctx.fillStyle=`rgba(127,119,221,${0.5+0.2*Math.sin(t*2+j)})`;
        rr(comp.x+10+j*34,comp.y+comp.h-bh-8,26,bh,3);
        ctx.fill();
      });
    } else if(comp.label==='Stats'){
      ctx.fillStyle='rgba(93,202,165,0.8)';
      ctx.font='bold 18px system-ui';
      ctx.textAlign='center';
      ctx.fillText('98%',comp.x+comp.w/2,comp.y+comp.h/2+6);
      ctx.textAlign='left';
    } else if(comp.label==='Chart'){
      ctx.beginPath();
      ctx.moveTo(comp.x+8,comp.y+comp.h-16);
      [0,1,2,3,4].forEach(j=>{
        const px=comp.x+8+j*(comp.w-16)/4;
        const py=comp.y+comp.h-16-Math.sin(t+j)*20-15;
        ctx.lineTo(px,py);
      });
      ctx.strokeStyle='rgba(239,159,39,0.9)';
      ctx.lineWidth=2;
      ctx.stroke();
    } else if(comp.label==='Sidebar'){
      [0,1,2,3,4].forEach(j=>{
        ctx.fillStyle=j===1?'rgba(127,119,221,0.8)':'rgba(83,74,183,0.4)';
        rr(comp.x+10,comp.y+20+j*30,comp.w-20,20,4);
        ctx.fill();
      });
    } else {
      ctx.fillStyle='rgba(127,119,221,0.5)';
      ctx.font='500 11px system-ui';
      ctx.textAlign='center';
      ctx.fillText(comp.label,comp.x+comp.w/2,comp.y+comp.h/2+4);
      ctx.textAlign='left';
    }
    ctx.restore();
  });

  // connector arrows between editor and UI
  if(t>2){
    const alpha=Math.min(1,(t-2)*0.5);
    ctx.globalAlpha=alpha*0.6;
    ctx.strokeStyle='#534AB7';
    ctx.lineWidth=1.5;
    ctx.setLineDash([5,4]);
    ctx.beginPath();
    ctx.moveTo(412,120);
    ctx.lineTo(440,120);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(412,200);
    ctx.lineTo(440,200);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha=1;
  }
}

function frame(){
  t+=0.018;
  ctx.clearRect(0,0,W,H);

  // bg
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#0d0c20');
  bg.addColorStop(1,'#0a0a14');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  // title
  ctx.fillStyle='rgba(127,119,221,0.15)';
  ctx.font='bold 88px system-ui';
  ctx.fillText('01',580,H-20);

  drawCode();
  drawUI();

  requestAnimationFrame(frame);
}
frame();
</script>
